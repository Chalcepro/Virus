name: Continuous Learning

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements-train.txt') }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-train.txt

    - name: Scrape and train on new wiki data
      run: python auto_learn_ci.py --num-articles 1

    - name: Configure Git
      run: |
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"

    - name: Commit and Push changes
      run: |
        git fetch origin main
        git pull origin main --rebase
        git add data/ auto_train_state.json vocab.json
        if git diff --quiet --cached; then
          echo "No changes to commit"
        else
          git commit -m "Auto-learn: new wiki data and model update"
          git push origin main
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
