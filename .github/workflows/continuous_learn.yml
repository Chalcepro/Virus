name: Continuous Learning (CI)

# Give the action write permissions to push changes
permissions:
  contents: write

on:
  schedule:
    - cron: '0 9 * * *'   # daily at 9:00 UTC
  workflow_dispatch:       # allow manual trigger

permissions:
  contents: write

permissions:
  contents: write

jobs:
  learn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Cache pip dependencies to speed up runs
      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run:
          # If you have a requirements.txt file, use it; otherwise fallback to inline
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install torch requests
          fi

      - name: Run continuous learner
        run: python continuous_learner.py

      - name: Commit and push changes
        run: |
          git pull
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Add data folder, model file, and state file (ignore if they don't exist)
          git add data/ model_v3.pt auto_train_state.json || true
          # Only commit and push if something was actually staged
          if ! git diff --staged --quiet; then
            git commit -m "Auto-learn: new data and model update [skip ci]"
            git push
          else
            echo "No staged changes to commit."
          fi
