name: Continuous Learning (CI)

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  learn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install torch requests

      - name: Run automated learning (no interactive)
        run: python auto_learn_ci.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ model_v3.pt auto_train_state.json || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-learn: new data and model update"
          git push
